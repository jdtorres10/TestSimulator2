<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U.S. Civics Test Simulator</title>
  <meta name="description" content="Bilingual (English/Spanish) practice simulator for the 2025 USCIS citizenship civics test.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="header-row">
        <div class="brand">
          <span class="flag" aria-hidden="true">🇺🇸</span>
          <div>
            <h1 id="appTitle">U.S. Civics Test Simulator</h1>
            <p id="tagline">Practice for the 2025 USCIS citizenship civics test</p>
          </div>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button id="langEn" type="button" aria-pressed="true">English</button>
          <button id="langEs" type="button" aria-pressed="false">Español</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="app" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footerText"></p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
